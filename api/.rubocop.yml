plugins:
  - rubocop-rails

AllCops:
  NewCops: disable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/seeds.rb"
    - "vendor/**/*"
    - "tmp/**/*"
    - "log/**/*"

# House style (matches the existing codebase)
Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 140

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "config/**/*"

Metrics/MethodLength:
  Max: 30
  Exclude:
    - "db/migrate/**/*"

Metrics/AbcSize:
  Max: 45

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 14

Metrics/ClassLength:
  Max: 200

Naming/MethodParameterName:
  Enabled: false

# We intentionally use update_columns/increment! for atomic counters that are
# already validated by the service layer.
Rails/SkipsModelValidations:
  Enabled: false

Rails/Blank:
  Enabled: false
